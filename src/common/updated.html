<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>悟道书签管理器 · 已更新</title>
<style>
:root{
  --bg:#0d1220; --card:#151b2e; --card-border:#232d4a;
  --text:#e8ecf6; --muted:#8b94ad; --accent:#5b8cff; --accent2:#7aa5ff;
  --accent-soft:rgba(91,140,255,.14); --shadow:0 8px 28px rgba(0,0,0,.42); --radius:14px;
}
:root[data-theme="light"]{
  --bg:#f2f4fa; --card:#ffffff; --card-border:#e0e6f3;
  --text:#1a2233; --muted:#5f6b85; --accent:#3468fa; --accent2:#5b8cff;
  --accent-soft:rgba(52,104,250,.12); --shadow:0 8px 24px rgba(40,60,120,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.7;
  display:flex; align-items:center; justify-content:center; padding:24px;
  background-image:radial-gradient(1200px 500px at 70% -10%, rgba(91,140,255,.10), transparent 60%),
                   radial-gradient(900px 400px at 10% -5%, rgba(123,90,255,.07), transparent 55%);
  background-attachment:fixed;
}
.card{
  width:100%; max-width:520px; background:var(--card); border:1px solid var(--card-border);
  border-radius:var(--radius); box-shadow:var(--shadow); padding:32px 30px 24px; text-align:center;
}
.logo{width:64px;height:64px;border-radius:16px;display:block;margin:0 auto 16px}
h1{margin:0 0 6px;font-size:21px;font-weight:650;letter-spacing:.2px}
h1 .v{color:var(--accent2); font-variant-numeric:tabular-nums}
.sub{margin:0 0 18px;color:var(--muted);font-size:13px}
.sub code{background:var(--accent-soft);color:var(--accent2);padding:1px 6px;border-radius:5px;font-size:12px}
ul.notes{
  list-style:none;margin:0 0 22px;padding:14px 16px;text-align:left;
  background:var(--accent-soft);border-radius:10px;font-size:13px;
}
ul.notes li{position:relative;padding-left:16px;margin:5px 0}
ul.notes li::before{content:"";position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{
  font-family:inherit;font-size:13.5px;padding:9px 20px;border-radius:9px;cursor:pointer;
  border:1px solid var(--card-border);background:transparent;color:var(--text);transition:.15s;
}
button:hover{border-color:var(--accent);color:var(--accent2)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{filter:brightness(1.08);color:#fff}
.foot{margin:20px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="icons/icon128.png" alt="">
  <h1>已更新到 <span class="v" id="ver">—</span></h1>
  <p class="sub" id="sub">旧版本 <code id="prev">—</code> 已被替换，你的书签数据没有任何变动。</p>
  <ul class="notes" id="notes"></ul>
  <div class="actions">
    <button class="primary" id="open">打开书签管理器</button>
    <button id="close">关闭本页</button>
  </div>
  <p class="foot">以后有新版本时浏览器会自动更新，装好后会再次打开本页告诉你。</p>
</main>
<script src="updated.js"></script>
</body>
</html>
